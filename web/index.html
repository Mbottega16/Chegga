<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0c10" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      (function() {
        try {
          var m = localStorage.getItem("chegga:theme:mode") || "dark";
          var resolved = m === "system" ? (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : m;
          document.documentElement.setAttribute("data-theme", resolved);
          var a = localStorage.getItem("chegga:theme:accent") || "amber";
          document.documentElement.setAttribute("data-accent", a);
        } catch (e) {}
      })();
    </script>

    <meta
      name="description"
      content="Play a real Stockfish opponent right in your browser and see how good each move was the moment you make it. No account needed. Want the deeper view? Connect your Chess.com username and your whole game history gets analyzed too — move-quality trends, opening repertoire, blunder patterns, time-pressure leaks. Nothing leaves your machine."
    />
    <link rel="canonical" href="https://chegga-web.vercel.app/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Chegga" />
    <meta property="og:title" content="Chegga — see how good each move was, the moment you make it" />
    <meta
      property="og:description"
      content="Play a real Stockfish opponent in your browser — every move graded and celebrated instantly. No account needed. Connect your Chess.com username for the deeper view: move-quality trends, opening repertoire, blunder patterns, time-pressure leaks."
    />
    <meta property="og:url" content="https://chegga-web.vercel.app/" />
    <meta property="og:image" content="https://chegga-web.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Chegga — browser-based chess trainer and Chess.com game analyzer" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Chegga — see how good each move was, the moment you make it" />
    <meta
      name="twitter:description"
      content="Play a real Stockfish opponent in your browser — every move graded and celebrated instantly. No account needed. Connect your Chess.com username for the deeper view."
    />
    <meta name="twitter:image" content="https://chegga-web.vercel.app/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      #splash {
        position: fixed; inset: 0; z-index: 3000; overflow: hidden;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: radial-gradient(circle at 50% 42%, #182237 0%, #0a0c10 68%);
        color: #f4f6fb; font-family: "Space Grotesk", system-ui, sans-serif;
        transition: opacity 0.45s ease;
      }
      #splash.sp-done { opacity: 0; pointer-events: none; }
      .sp-defs { position: absolute; width: 0; height: 0; }
      .sp-band {
        position: absolute; top: -30%; height: 160%; width: 34vw; left: 0;
        transform: translateX(calc(-40vw - 60vh)) skewX(-22deg); opacity: 0.9;
        animation: sp-wipe 0.95s cubic-bezier(0.55, 0.05, 0.25, 1) both;
      }
      .sp-band-gold { background: linear-gradient(90deg, transparent, #e3a857); }
      .sp-band-cyan { background: linear-gradient(90deg, transparent, #22d3ee); width: 18vw; animation-delay: 0.13s; }
      .sp-flight { position: relative; width: min(220px, 46vw); aspect-ratio: 38 / 36; }
      .sp-piece {
        position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible;
        animation: sp-swoosh 1.15s cubic-bezier(0.2, 0.75, 0.2, 1) 0.18s both;
      }
      .sp-main { filter: drop-shadow(0 14px 26px rgba(0, 0, 0, 0.55)); }
      .sp-ghost { animation-name: sp-trail; }
      .sp-ghost-1 { animation-delay: 0.23s; --sp-o: 0.45; }
      .sp-ghost-2 { animation-delay: 0.28s; --sp-o: 0.28; }
      .sp-ghost-3 { animation-delay: 0.33s; --sp-o: 0.15; }
      .sp-name {
        margin: 18px 0 0; font-size: 2.4rem; font-weight: 700; letter-spacing: -0.02em;
        animation: sp-rise 0.45s ease-out 1.1s both;
      }
      .sp-wheel {
        width: 38px; height: 38px; margin-top: 26px; border-radius: 50%;
        border: 4px solid rgba(255, 255, 255, 0.12);
        border-top-color: #e3a857; border-right-color: #22d3ee;
        animation: sp-spin 0.8s linear infinite, sp-rise 0.35s ease-out 1.4s both;
      }
      .sp-message {
        margin: 16px 24px 0; font: 500 0.9rem/1.5 Inter, system-ui, sans-serif; color: #9aa6bd; text-align: center;
        animation: sp-rise 0.35s ease-out 1.5s both;
      }
      .sp-continue .sp-band, .sp-continue .sp-ghost { display: none; }
      .sp-continue .sp-main, .sp-continue .sp-name, .sp-continue .sp-message { animation: none; }
      .sp-continue .sp-wheel { animation: sp-spin 0.8s linear infinite; }
      @keyframes sp-wipe { from { transform: translateX(calc(-40vw - 60vh)) skewX(-22deg); } to { transform: translateX(calc(100vw + 60vh)) skewX(-22deg); } }
      @keyframes sp-swoosh {
        0% { transform: translate(-70vw, 16vh) rotate(-28deg) scale(1.8); opacity: 0; }
        12% { opacity: 1; }
        72% { transform: translate(22px, -6px) rotate(7deg) scale(1.04); opacity: 1; }
        100% { transform: none; opacity: 1; }
      }
      @keyframes sp-trail {
        0% { transform: translate(-70vw, 16vh) rotate(-28deg) scale(1.8); opacity: 0; }
        12% { opacity: var(--sp-o); }
        72% { transform: translate(22px, -6px) rotate(7deg) scale(1.04); opacity: var(--sp-o); }
        100% { transform: none; opacity: 0; }
      }
      @keyframes sp-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      @keyframes sp-spin { to { rotate: 360deg; } }
      @media (prefers-reduced-motion: reduce) {
        .sp-band, .sp-ghost { display: none; }
        .sp-main, .sp-name, .sp-message { animation: none; }
        .sp-wheel { animation: sp-spin 1.6s linear infinite; }
      }
    </style>
    <noscript><style>#splash { display: none; }</style></noscript>
    <title>Chegga</title>
  </head>
  <body>
    <!-- Start-up screen. It lives here, not in the bundle, so it paints before
         any script loads; src/splash.ts takes it away once the app is ready. -->
    <div id="splash" role="status">
      <svg class="sp-defs" aria-hidden="true">
        <defs>
          <linearGradient id="sp-tone" gradientUnits="userSpaceOnUse" x1="8" y1="8" x2="38" y2="40">
            <stop offset="0.5" stop-color="#e3a857" />
            <stop offset="0.5" stop-color="#22d3ee" />
          </linearGradient>
          <g id="sp-knight" stroke="#0b101a" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
            <path fill="url(#sp-tone)" d="M22 10c10.5 1 16.5 8 16 29H15c0-9 10-6.5 8-21" />
            <path fill="url(#sp-tone)" d="M24 18c.38 2.91-5.55 7.37-8 9-3 2-2.82 4.34-5 4-1.042-.94 1.41-3.04 0-3-1 0 .19 1.23-1 2-1 0-4.003 1-4-4 0-2 6-12 6-12s1.89-1.9 2-3.5c-.73-.994-.5-2-.5-3 1-1 3 2.5 3 2.5h2s.78-1.992 2.5-3c1 0 1 3 1 3" />
            <path fill="#0b101a" d="M9.5 25.5a.5.5 0 1 1-1 0 .5.5 0 1 1 1 0m5.433-9.75a.5 1.5 30 1 1-.866-.5.5 1.5 30 1 1 .866.5" />
          </g>
        </defs>
      </svg>
      <div class="sp-band sp-band-gold" aria-hidden="true"></div>
      <div class="sp-band sp-band-cyan" aria-hidden="true"></div>
      <div class="sp-flight" aria-hidden="true">
        <svg class="sp-piece sp-ghost sp-ghost-3" viewBox="4 6 38 36"><use href="#sp-knight" /></svg>
        <svg class="sp-piece sp-ghost sp-ghost-2" viewBox="4 6 38 36"><use href="#sp-knight" /></svg>
        <svg class="sp-piece sp-ghost sp-ghost-1" viewBox="4 6 38 36"><use href="#sp-knight" /></svg>
        <svg class="sp-piece sp-main" viewBox="4 6 38 36"><use href="#sp-knight" /></svg>
      </div>
      <p class="sp-name">Chegga</p>
      <div class="sp-wheel" aria-hidden="true"></div>
      <p class="sp-message" id="splash-message">Loading…</p>
    </div>
    <script>
      (function () {
        var splash = document.getElementById("splash");
        try {
          // Reloading to finish loading: carry on at the wheel, no second swoosh.
          if (sessionStorage.getItem("chegga-web:splash-continue")) {
            sessionStorage.removeItem("chegga-web:splash-continue");
            splash.className = "sp-continue";
          }
        } catch (e) {}
        // A start-up failure must never leave the visitor stuck behind this.
        setTimeout(function () { splash.addEventListener("click", function () { splash.remove(); }); }, 12000);
        setTimeout(function () { splash.remove(); }, 90000);
      })();
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
